# RobotPolicy task family implemented by this success adapter.
task_family: standup
# The mjlab environment this task is evaluated in. The success predicate below
# and this environment must agree: a velocity predicate scored against a
# StandUp rollout produces confident, wrong numbers with nothing in the result
# to flag it. Declared here, next to the predicate, because the same person
# owns both.
mjlab_task_id: Mjlab-StandUp-Flat-MicroDuck
# Frozen deterministic task-success definition.
#
# CALIBRATION NOTE -- why min_base_height_m is 0.10 and not 0.16
# --------------------------------------------------------------
# v0.1 used 0.16 m. The upstream task's own constant states:
#     # STAND_Z = empirically-measured trunk z at the natural standing equilibrium
#     STAND_Z = 0.115
# so 0.16 m was 39% ABOVE the height this robot physically reaches. Measured
# across 300 episodes and 3 different policies, the tallest trunk ever observed
# was 0.1213 m: the predicate was unsatisfiable and every policy scored 0/100
# by construction. See calibrate.py.
#
# 0.10 m is derived, not chosen for a nicer score:
#   - 87% of STAND_Z (0.115), leaving margin for the tilt the pose allows
#   - strictly above the sitting keyframe spawn band (0.05-0.09 m), so a robot
#     that never leaves the sit cannot pass
#   - well above the prone/settled band (~0.036-0.07 m)
success_predicate:
  min_base_height_m: 0.10
  max_tilt_deg: 20
  stable_for_s: 1.0
  sample_dt_s: 0.02
